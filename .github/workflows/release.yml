name: Auto Release

on:
  push:
    branches:
      - master

jobs:
  release:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Read version
        id: version
        run: |
          $v = Get-Content QwenAgent.Cli/version.txt
          echo "version=$v" >> $env:GITHUB_OUTPUT

      - name: Create Tag
        uses: mathieudutour/github-tag-action@v6.1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          custom_tag: ${{ steps.version.outputs.version }}
          tag_prefix: ""

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Publish
        run: dotnet publish QwenAgent.Cli/QwenAgent.Cli.csproj -c Release -o publish

      - name: Zip
        run: Compress-Archive -Path publish/* -DestinationPath QwenAgent.zip

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.version }}
          name: "QwenAgent ${{ steps.version.outputs.version }}"
          files: QwenAgent.zip
          prerelease: false
          draft: false

